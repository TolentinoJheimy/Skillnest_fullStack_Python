<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nuevo Usuario</title>

<style>

*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, Helvetica, sans-serif;
}

body{
    background: rgb(236,236,236);
}

/* CONTENEDOR */
.contenedor{
    width: 380px;
    margin: 28px auto;
}

/* TITULO */
h1{
    text-align: center;
    font-size: 38px;
    font-weight: bold;
    color: black;
    margin-bottom: 22px;
}

/* FILAS */
.fila{
    display: flex;
    align-items: center;
    margin-bottom: 10px;
}

/* LABELS */
label{
    width: 160px;
    font-size: 20px;
    color: black;
}

/* INPUTS */
input{
    width: 115px;
    height: 38px;
    border: 4px solid black;
    background: white;
    outline: none;
}

/* SELECT */
select{
    text-align: center;
    width: 155px;
    height: 38px;
    border: 4px solid black;
    background: white;
    font-size: 17px;
    outline: none;
}

/* BOTÓN */
button{
    width: 78px;
    height: 42px;
    margin-left: 155px;
    margin-top: 6px;

    background: white;
    border: 5px solid black;

    font-size: 22px;
    cursor: pointer;

    /* sombra exacta */
    box-shadow:
        inset 0 0 0 1px white,
        2px 2px 0 black;
}

</style>
</head>

<body>

<div class="contenedor">

    <h1>Nuevo Usuario</h1>

    <div class="fila">
        <label>Nombre</label>
        <input type="text">
    </div>

    <div class="fila">
        <label>E-mail</label>
        <input type="email">
    </div>

    <div class="fila">
        <label>Contraseña</label>
        <input type="password">
    </div>

    <div class="fila">
        <label>Conf. Contraseña</label>
        <input type="password">
    </div>

    <div class="fila">
        <label>Tipo de Usuario</label>

        <select>
            <option>Administrador</option>
            <option>Usuario</option>
        </select>
    </div>

    <button>Crear</button>

</div>

</body>
</html>
