<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Usuario</title>

<style>

*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, Helvetica, sans-serif;
}

body{
    background: rgb(236,236,236);
}

/* CONTENEDOR GENERAL */
.contenedor{
    width: 980px;
    margin: 55px auto;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
}

/* BLOQUES */
.login{
    width: 360px;
}

.registro{
    width: 390px;
}

/* TITULOS */
h1{
    font-size: 37px;
    font-weight: normal;
    color: black;
    margin-bottom: 34px;
}

/* El título REGISTRO va centrado */
.registro h1{
    text-align: center;
}

/* FILAS */
.fila{
    display: flex;
    align-items: center;
    margin-bottom: 16px;
}

/* LABELS */
label{
    width: 175px;
    font-size: 20px;
    color: black;
}

/* INPUTS */
input{
    width: 140px;
    height: 45px;
    border: 4px solid black;
    background: white;
    outline: none;
    padding: 5px;
}

/* BOTONES */
button{
    height: 47px;
    background: white;
    border: 5px solid black;
    font-size: 19px;
    cursor: pointer;
    box-shadow:
        inset 0 0 0 2px white,
        2px 2px 0 black;
}

/* LOGIN */
.login button{
    width: 183px;
    margin-left: 82px;
    margin-top: 8px;
}

/* REGISTRO */
.registro button{
    width: 170px;

    /* centrado real */
    display: block;
    margin: 18px auto 0 auto;
}

/* Ajuste último texto */
.conf{
    letter-spacing: -0.5px;
}

</style>
</head>

<body>

<div class="contenedor">

    <!-- LOGIN -->
    <div class="login">

        <h1>Inicio de Sesión</h1>

        <div class="fila">
            <label>E-mail</label>
            <input type="email">
        </div>

        <div class="fila">
            <label>Contraseña</label>
            <input type="password">
        </div>

        <button>Iniciar Sesión</button>

    </div>


    <!-- REGISTRO -->
    <div class="registro">

        <h1>Registro</h1>

        <div class="fila">
            <label>Nombre</label>
            <input type="text">
        </div>

        <div class="fila">
            <label>E-mail</label>
            <input type="email">
        </div>

        <div class="fila">
            <label>Contraseña</label>
            <input type="password">
        </div>

        <div class="fila">
            <label class="conf">Conf. Contraseña</label>
            <input type="password">
        </div>

        <button>Registrar</button>

    </div>

</div>

</body>
</html>
