<!DOCTYPE html>
<html lang="es">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Listado de Videojuegos</title>

    <style>

        body{
            font-family: Arial, Helvetica, sans-serif;
            background:#f2f2f2;
            margin:40px;
        }

        h1{
            text-align:center;
        }

        table{
            width:80%;
            margin:auto;
            border-collapse:collapse;
            background:white;
        }

        th{
            background:#3498db;
            color:white;
            padding:12px;
        }

        td{
            border:1px solid #ccc;
            padding:10px;
            text-align:center;
        }

        tr:nth-child(even){
            background:#eeeeee;
        }

    </style>

</head>
<body>

<h1>Listado de Videojuegos</h1>

<table>

    <tr>
        <th>N°</th>
        <th>Nombre</th>
        <th>Plataforma</th>
        <th>Año</th>
    </tr>

    {% for videojuego in videojuegos %}

    <tr>

        <td>{{ loop.index }}</td>

        <td>{{ videojuego["nombre"] }}</td>

        <td>{{ videojuego["plataforma"] }}</td>

        <td>{{ videojuego["anio"] }}</td>

    </tr>

    {% endfor %}

</table>

</body>
</html>
