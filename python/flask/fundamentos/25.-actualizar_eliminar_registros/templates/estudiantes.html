<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Estudiantes</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>
    <div class="container mt-5">
        <h1 class="mb-4">Lista de Estudiantes</h1>
        <table class="table table-striped table-bordered">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>E-mail</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                {% for estudiante in todos_estudiantes %}
                <tr>
                    <td>{{ estudiante.id_estudiante }}</td>
                    <td>{{ estudiante.nombre }}</td>
                    <td>{{ estudiante.email }}</td>
                    <td>
                        <a href="{{ url_for('mostrar_estudiante', id_estudiante=estudiante.id_estudiante) }}"
                            class="btn btn-sm btn-info text-white">Ver</a>
                        <a href="{{ url_for('editar_estudiante', id_estudiante=estudiante.id_estudiante) }}"
                            class="btn btn-sm btn-warning text-white">Editar</a>
                        <a href="{{ url_for('eliminar_estudiante', id_estudiante=estudiante.id_estudiante) }}"
                            class="btn btn-sm btn-danger"
                            onclick="return confirm('¿Estás seguro de eliminar este estudiante?')">Eliminar</a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>

</html>
