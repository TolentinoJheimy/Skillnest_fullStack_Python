<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Editar Taco</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.min.css') }}">
</head>

<body>
    <div class="container mt-5">
        <h1 class="mb-4">Modificar Orden #{{ taco.id }}</h1>
        <form action="{{ url_for('actualizar') }}" method="POST" class="card p-4 shadow-sm" style="max-width: 500px;">
            <input type="hidden" name="id" value="{{ taco.id }}">
            <div class="mb-3">
                <label for="tortilla" class="form-label">Tipo de Tortilla</label>
                <input type="text" name="tortilla" id="tortilla" class="form-control" value="{{ taco.tortilla }}"
                    required>
            </div>
            <div class="mb-3">
                <label for="guiso" class="form-label">Guiso / Relleno</label>
                <input type="text" name="guiso" id="guiso" class="form-control" value="{{ taco.guiso }}" required>
            </div>
            <div class="mb-3">
                <label for="salsa" class="form-label">Salsa</label>
                <input type="text" name="salsa" id="salsa" class="form-control" value="{{ taco.salsa }}" required>
            </div>
            <div class="d-flex justify-content-between">
                <button type="submit" class="btn btn-success">Actualizar</button>
                <a href="{{ url_for('resultados') }}" class="btn btn-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</body>

</html>
