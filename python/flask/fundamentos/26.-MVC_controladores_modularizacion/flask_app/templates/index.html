<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Crear Taco</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.min.css') }}">
</head>

<body>
    <div class="container mt-5">
        <h1 class="mb-4">Arma tu Taco</h1>
        <form action="{{ url_for('crear_taco') }}" method="POST" class="card p-4 shadow-sm" style="max-width: 500px;">
            <div class="mb-3">
                <label for="tortilla" class="form-label">Tipo de Tortilla</label>
                <input type="text" name="tortilla" id="tortilla" class="form-control" required>
            </div>
            <div class="mb-3">
                <label for="guiso" class="form-label">Guiso / Relleno</label>
                <input type="text" name="guiso" id="guiso" class="form-control" required>
            </div>
            <div class="mb-3">
                <label for="salsa" class="form-label">Salsa</label>
                <input type="text" name="salsa" id="salsa" class="form-control" required>
            </div>
            <div class="d-flex justify-content-between">
                <button type="submit" class="btn btn-success">Guardar Taco</button>
                <a href="{{ url_for('resultados') }}" class="btn btn-secondary">Ver Todos</a>
            </div>
        </form>
    </div>
</body>

</html>
