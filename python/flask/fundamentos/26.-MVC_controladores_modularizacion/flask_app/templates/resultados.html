<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Todos los Tacos</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.min.css') }}">
</head>

<body>
    <div class="container mt-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>Menú de Tacos</h1>
            <a href="{{ url_for('index') }}" class="btn btn-primary">Nuevo Taco</a>
        </div>
        <table class="table table-striped table-bordered">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Tortilla</th>
                    <th>Guiso</th>
                    <th>Salsa</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                {% for taco in todos_tacos %}
                <tr>
                    <td>{{ taco.id }}</td>
                    <td>{{ taco.tortilla }}</td>
                    <td>{{ taco.guiso }}</td>
                    <td>{{ taco.salsa }}</td>
                    <td>
                        <a href="{{ url_for('detalle', id=taco.id) }}" class="btn btn-sm btn-info text-white">Ver</a>
                        <a href="{{ url_for('editar', id=taco.id) }}"
                            class="btn btn-sm btn-warning text-white">Editar</a>
                        <a href="{{ url_for('eliminar', id=taco.id) }}" class="btn btn-sm btn-danger"
                            onclick="return confirm('¿Eliminar este taco?')">Borrar</a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>

</html>
