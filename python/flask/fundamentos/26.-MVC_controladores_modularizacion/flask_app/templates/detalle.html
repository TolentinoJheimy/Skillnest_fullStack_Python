<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Detalle del Taco</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.min.css') }}">
</head>

<body>
    <div class="container mt-5">
        <h1 class="mb-4">Orden de Taco #{{ taco.id }}</h1>
        <div class="card p-4 shadow-sm mb-4" style="max-width: 500px;">
            <p><strong>Tortilla:</strong> {{ taco.tortilla }}</p>
            <p><strong>Guiso:</strong> {{ taco.guiso }}</p>
            <p><strong>Salsa:</strong> {{ taco.salsa }}</p>
        </div>
        <div class="d-flex gap-2">
            <a href="{{ url_for('editar', id=taco.id) }}" class="btn btn-warning text-white">Editar</a>
            <a href="{{ url_for('resultados') }}" class="btn btn-secondary">Volver al Listado</a>
        </div>
    </div>
</body>

</html>
