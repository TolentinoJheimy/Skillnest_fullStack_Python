<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Frutas</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <!-- ===================== NAVBAR ===================== -->

    <nav class="navbar navbar-expand-lg navbar-dark bg-success">
        <div class="container">

            <a class="navbar-brand fw-bold" href="{{ url_for('index') }}">
                <i class="bi bi-apple"></i>
                Mercado de Frutas
            </a>

            <div>
                <a class="nav-link text-white d-inline me-3" href="{{ url_for('index') }}">
                    Inicio
                </a>

                <a class="nav-link text-white d-inline" href="{{ url_for('catalogo') }}">
                    Catálogo
                </a>
            </div>

        </div>
    </nav>

    <!-- ===================== HERO ===================== -->

    <header class="hero text-center text-white py-5 bg-secondary mb-5">

        <div class="container">

            <h1 class="fw-bold">
                Catálogo de Frutas
            </h1>

            <p>
                Descubre todas las frutas frescas disponibles en nuestro mercado.
            </p>

        </div>

    </header>

    <!-- ===================== CATÁLOGO ===================== -->

    <div class="container">

        <div class="row">

            {% for fruta in frutas %}

            <div class="col-lg-3 col-md-4 col-sm-6 mb-4">

                <div class="card fruta-card h-100 shadow-sm">

                    <img
                        src="{{ url_for('static', filename='images/' + fruta.imagen) }}"
                        class="card-img-top p-3"
                        alt="{{ fruta.nombre }}">

                    <div class="card-body">

                        <h5 class="card-title">
                            {{ fruta.nombre }}
                        </h5>

                        <h6 class="text-success fw-bold">
                            ${{ "%.2f"|format(fruta.precio) }}
                        </h6>

                        <p class="card-text">
                            {{ fruta.descripcion }}
                        </p>

                    </div>

                </div>

            </div>

            {% endfor %}

        </div>

        <div class="text-center mt-4 mb-5">

            <a href="{{ url_for('index') }}" class="btn btn-success">

                <i class="bi bi-arrow-left-circle"></i>

                Volver al Mercado

            </a>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
