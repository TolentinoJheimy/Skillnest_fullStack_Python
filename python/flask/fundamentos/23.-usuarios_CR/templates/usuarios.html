<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Usuarios</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>

<body class="bg-light">

    <div class="container mt-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>Todos los usuarios</h1>
            <a href="{{ url_for('nuevo_usuario') }}" class="btn btn-primary">Agregar nuevo usuario</a>
        </div>

        <div class="card shadow-sm">
            <div class="card-body p-0">
                <table class="table table-striped table-hover mb-0">
                    <thead class="table-dark">
                        <tr>
                            <th scope="col" class="ps-4">ID</th>
                            <th scope="col">Nombre Completo</th>
                            <th scope="col">E-mail</th>
                            <th scope="col" class="pe-4">Fecha de creación</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for u in usuarios %}
                        <tr>
                            <td class="ps-4 fw-bold">{{ u.id }}</td>
                            <td>{{ u.nombre }} {{ u.apellido }}</td>
                            <td>{{ u.email }}</td>
                            <td class="pe-4 text-muted">{{ u.created_at.strftime('%Y-%m-%d %H:%M') if u.created_at else
                                '' }}</td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</body>

</html>
