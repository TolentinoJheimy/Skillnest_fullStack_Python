<!DOCTYPE html>

<html lang="es">

<head>

<meta charset="UTF-8">

<title>Nuevo Usuario</title>


<link 
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
rel="stylesheet">


</head>


<body>


<div class="container py-5">


<h1>
Crear usuario
</h1>



<form 
action="{{ url_for('crear_usuario') }}"
method="POST">



<input
class="form-control mb-3"
type="text"
name="nombre"
placeholder="Nombre"
required>



<input
class="form-control mb-3"
type="text"
name="apellido"
placeholder="Apellido"
required>



<input
class="form-control mb-3"
type="email"
name="email"
placeholder="Email"
required>



<button class="btn btn-success">

Crear

</button>



</form>


</div>


</body>

</html>
