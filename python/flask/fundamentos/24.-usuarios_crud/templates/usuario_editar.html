<!DOCTYPE html>

<html lang="es">


<head>


<meta charset="UTF-8">


<title>
Editar Usuario
</title>



<link 
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
rel="stylesheet">


<link 
rel="stylesheet"
href="{{ url_for('static', filename='css/style.css') }}">


</head>



<body>



<div class="container py-5">


<div class="formulario">


<h1>
Editar usuario
</h1>



<form

action="{{ url_for('actualizar_usuario', id=usuario.id) }}"

method="POST"

>



<label>
Nombre
</label>


<input

class="form-control mb-3"

type="text"

name="nombre"

value="{{ usuario.nombre }}"

required

>




<label>
Apellido
</label>



<input

class="form-control mb-3"

type="text"

name="apellido"

value="{{ usuario.apellido }}"

required

>




<label>
Email
</label>



<input

class="form-control mb-3"

type="email"

name="email"

value="{{ usuario.email }}"

required

>




<button class="btn btn-success">

Actualizar

</button>



<a

class="btn btn-secondary"

href="{{ url_for('usuarios') }}">

Cancelar

</a>



</form>



</div>


</div>


</body>


</html>
