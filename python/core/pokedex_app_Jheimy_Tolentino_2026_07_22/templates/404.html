<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pokémon no encontrado</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

    <div class="error-container">

        <div class="error-card">

            <h1>¡Oh no!</h1>
            <div class="mensaje">
                <p class="mensaje-auto">
                    {{ mensaje }}
                </p>
            </div>

            <div class="error-icon">
                <p style="color: red; font-size: 25px; font-weight: bold;"><i
                        class="bi bi-exclamation-triangle-fill"></i> Pokémon no encontrado</p>
            </div>

            <p class="mensaje-mal">Tal vez este Pokémon aún no ha sido descubierto, o quizás has escrito mal su nombre
            </p>



            <a href="/pokemon" class="btn btn-primary" style="display: flex; align-items: center; gap: 5px;">
                <i class="fa-solid fa-house"></i> Volver a la Pokédex
            </a>

        </div>

    </div>

</body>

</html>
