<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cursos</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>

<body>

    <div class="contenedor">

        <div class="seccion">

            <h1>Nuevo Curso</h1>

            <form action="/cursos/crear" method="POST">

                <div class="campo">
                    <label for="nombre">Nombre:</label>

                    <input
                        type="text"
                        name="nombre"
                        id="nombre"
                        required
                    >
                </div>

                <button type="submit">
                    Crear
                </button>

            </form>

        </div>


        <div class="seccion">

            <h1>Todos los Cursos</h1>

            <div class="lista-cursos">

                {% for curso in cursos %}

                    <a href="/cursos/{{ curso.id }}">
                        {{ curso.nombre }}
                    </a>

                {% endfor %}

            </div>

            <a
                href="/estudiante"
                class="enlace-estudiante"
            >
                Agregar Estudiante
            </a>

        </div>

    </div>

</body>

</html>
