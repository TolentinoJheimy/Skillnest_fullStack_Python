<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Detalle del usuario</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>

<body>

<div class="container py-5">

    <div class="detail-box">

        <span class="badge text-bg-primary">
            Usuario #{{ usuario.id }}
        </span>

        <h1 class="mt-3">
            {{ usuario.nombre }} {{ usuario.apellido }}
        </h1>

        <hr>

        <div class="user-data">

            <div>
                <small>Nombre</small>
                <strong>{{ usuario.nombre }}</strong>
            </div>

            <div>
                <small>Apellido</small>
                <strong>{{ usuario.apellido }}</strong>
            </div>

            <div>
                <small>Correo electrónico</small>
                <strong>{{ usuario.email }}</strong>
            </div>

            <div>
                <small>Fecha de creación</small>
                <strong>{{ usuario.created_at }}</strong>
            </div>

            <div>
                <small>Última modificación</small>
                <strong>{{ usuario.updated_at }}</strong>
            </div>

        </div>


        <div class="d-flex gap-2 mt-4">

            <a
                href="{{ url_for('formulario_edicion', id=usuario.id) }}"
                class="btn btn-warning"
            >
                Editar
            </a>

            <a
                href="{{ url_for('eliminar_usuario', id=usuario.id) }}"
                class="btn btn-danger"
                onclick="return confirm('¿Eliminar este usuario?');"
            >
                Eliminar
            </a>

            <a
                href="{{ url_for('mostrar_usuarios') }}"
                class="btn btn-outline-secondary"
            >
                Volver
            </a>

        </div>

    </div>

</div>

</body>
</html>
