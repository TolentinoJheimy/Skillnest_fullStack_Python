<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Editar Usuario</title>

<style>
    body{
        margin:0;
        padding:0;
        background:#f3f3f3;
        font-family: Arial, Helvetica, sans-serif;
    }

    .contenedor{
        width: 560px;
        margin: 40px auto;
        position: relative;
    }

    h1{
        text-align:center;
        font-size: 30px;
        margin-bottom: 18px;
        font-weight: bold;
        color:#000;
    }

    .formulario{
        width: 100%;
    }

    .fila{
        display:flex;
        align-items:center;
        margin-bottom: 12px;
    }

    .fila label{
        width: 170px;
        text-align:left;
        font-size: 16px;
        font-weight: bold;
        color:#333;
        padding-left: 95px;
    }

    .fila input,
    .fila select{
        width: 210px;
        height: 30px;
        border: 3px solid #000;
        font-size: 16px;
        padding-left: 8px;
        box-sizing: border-box;
        background:white;
    }

    .fila select{
        appearance: auto;
        cursor:pointer;
    }

    .btn{
        margin-left: 230px;
        margin-top: 6px;
        width: 72px;
        height: 34px;
        border: 3px solid #000;
        background:#fff;
        font-size: 16px;
        font-weight:bold;
        cursor:pointer;
    }

    .btn:active{
        transform: scale(0.98);
    }
</style>
</head>

<body>

<div class="contenedor">

    <h1>Editar Usuario</h1>

    <form class="formulario">

        <div class="fila">
            <label>Nombre</label>
            <input type="text" value="Patricia">
        </div>

        <div class="fila">
            <label>E-mail</label>
            <input type="email" value="patricia@codingdojo.com">
        </div>

        <div class="fila">
            <label>Contraseña</label>
            <input type="password" value="123456789">
        </div>

        <div class="fila">
            <label>Conf. Contraseña</label>
            <input type="password" value="123456789">
        </div>

        <div class="fila">
            <label>Tipo de Usuario</label>

            <select>
                <option selected>Administrador</option>
                <option>Usuario</option>
            </select>
        </div>

        <button class="btn">Crear</button>

    </form>

</div>

</body>
</html>
